<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Page</title>
    <link rel="stylesheet" type="text/css" href="main.css">
	<script src="main.js" defer></script>
</head>
<body>
	<main aria-label="Кошик">
		<section class="management" aria-label="Керування товарами">
			<form class="product-input">
				<label for="product-name" aria-label="Назва товару"></label>
				<input type="text" id="product-name" placeholder="Назва товару">
				<button type="submit" data-tooltip="Додати товар">Додати</button>
			</form>
			<ul>
				<li class="is-bought">
					<span class="product-title">Яблука</span>
					<span class="number-of">
						<button type="button" data-tooltip="Зменшити кількість" aria-label="Зменшити кількість">&minus;</button>
						<span class="n">2</span>
						<button type="button" data-tooltip="Збільшити кількість" aria-label="Збільшити кількість">&plus;</button>
					</span>
					<div class="controls">
						<button type="button" class="status" data-tooltip="Позначити як не куплено">Не куплено</button>
						<button type="button" class="delete" aria-label="Видалити товар" data-tooltip="Видалити товар">&times;</button>
					</div>
				</li>
				<li>
					<span class="product-title">Банани</span>
					<span class="number-of">
						<button type="button" data-tooltip="Зменшити кількість" aria-label="Зменшити кількість">&minus;</button>
						<span class="n">2</span>
						<button type="button" data-tooltip="Збільшити кількість" aria-label="Збільшити кількість">&plus;</button>
					</span>
					<div class="controls">
						<button type="button" class="status" data-tooltip="Позначити як куплено">Куплено</button>
						<button type="button" class="delete" aria-label="Видалити товар" data-tooltip="Видалити товар">&times;</button>
					</div>
				</li>
				<li>
					<div class="product-edit-container">		
						<input type="text" class="product-edit" value="Сир" aria-label="Редагування назви товару" name="edit-product">
					</div>	
					<span class="number-of">
						<button type="button" data-tooltip="Зменшити кількість" aria-label="Зменшити кількість" disabled>&minus;</button>
						<span class="n">1</span>
						<button type="button" data-tooltip="Збільшити кількість" aria-label="Збільшити кількість">&plus;</button>
					</span>
					<div class="controls">
						<button type="button" class="status" data-tooltip="Позначити як куплено">Куплено</button>
						<button type="button" class="delete" aria-label="Видалити товар" data-tooltip="Видалити товар">&times;</button>
					</div>
				</li>
			</ul>
		</section>
		<aside>
			<div class="left">
				<h3>Залишилося</h3>
				<div class="tags-container">
					<span class="product-item">
						<span class="name">Банани</span>
						<span class="amount">2</span>
					</span>
					<span class="product-item">
						<span class="name">Сир</span>
						<span class="amount">1</span>
					</span>
				</div>
			</div>
			<div class="is-bought">
				<h3>Куплено</h3>
				<div class="tags-container">
					<span class="product-item">
						<span class="name">Яблука</span>
						<span class="amount">2</span>
					</span>
				</div>
			</div>
		</aside>
	</main>
	<div class="author-badge">
    	<span class="badge-title">Buy List</span>
    	<div class="badge-details">
       		Created by:<br>
        	<span>Daryna</span>
    	</div>
	</div>
	<footer>
	</footer>
</body>
</html>
