<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Page</title>
    <link rel="stylesheet" type="text/css" href="main.css">
	<script src="main.js" defer></script>
</head>
<body>
	<main aria-label="Кошик">
		<section class="management" aria-label="Керування товарами">
			<form class="product-input">
				<label for="product-name" aria-label="Назва товару"></label>
				<input type="text" id="product-name" placeholder="Назва товару">
				<button type="submit" data-tooltip="Додати товар">Додати</button>
			</form>
			<ul><!--list of products will be here--></ul>
		</section>
		<aside>
			<div class="left">
				<h3>Залишилося</h3>
				<div class="tags-container">
					<!--products that are not bought will be here-->
				</div>
			</div>
			<div class="is-bought">
				<h3>Куплено</h3>
				<div class="tags-container">
					<!--products that are bought will be here-->
				</div>
			</div>
		</aside>
	</main>
	<div class="author-badge">
    	<span class="badge-title">Buy List</span>
    	<div class="badge-details">
       		Created by:<br>
        	<span>Daryna</span>
    	</div>
	</div>
	<footer>
	</footer>
</body>
</html>
